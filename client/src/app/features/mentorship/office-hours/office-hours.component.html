<div class="office-hours-container">
  <h2>Manage Office Hours</h2>
  
  <div class="card add-form">
    <h3>Add New Slot</h3>
    <div class="form-grid">
      <div class="form-group">
        <label>Date</label>
        <input type="date" [(ngModel)]="newSlot.date">
      </div>
      <div class="form-group">
        <label>Start Time</label>
        <input type="time" [(ngModel)]="newSlot.startTime">
      </div>
      <div class="form-group">
        <label>End Time</label>
        <input type="time" [(ngModel)]="newSlot.endTime">
      </div>
      <div class="form-group full-width">
        <label>Topic</label>
        <input type="text" [(ngModel)]="newSlot.topic" placeholder="e.g. Code Review, Career Advice">
      </div>
    </div>
    <div class="actions">
      <button class="btn-primary" (click)="addSlot()">Add Slot</button>
    </div>
  </div>

  <div class="card slots-list">
    <h3>Your Slots</h3>
    <div *ngIf="slots.length === 0" class="empty-state">No slots added yet.</div>
    <div class="slot-item" *ngFor="let slot of slots">
      <div class="info">
        <strong>{{ slot.date | date }}</strong> 
        <span>{{ slot.startTime }} - {{ slot.endTime }}</span>
        <span class="topic">{{ slot.topic }}</span>
      </div>
      <div class="status" [ngClass]="{'booked': slot.isBooked, 'available': !slot.isBooked}">
        {{ slot.isBooked ? 'Booked' : 'Available' }}
      </div>
    </div>
  </div>
</div>
