<div class="container py-4">
  <div class="header-flex">
    <h1 class="page-title mb-0">Edit Profile</h1>
    <a [routerLink]="['/profile/view', 'me']" class="btn btn-secondary">
      <lucide-icon name="eye" size="18"></lucide-icon> View Profile
    </a>
  </div>

  <div *ngIf="isLoading" class="loading-state">
    <div class="spinner"></div>
    <p class="mt-3">Loading profile data...</p>
  </div>

  <div *ngIf="!isLoading">
    <div *ngIf="successMessage" class="alert alert-success">{{ successMessage }}</div>
    <div *ngIf="errorMessage" class="alert alert-error">{{ errorMessage }}</div>

    <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="profile-form">
      <!-- Basic Info -->
      <div class="card section-card">
        <h3>Basic Information</h3>
        <div class="form-group">
          <label>Headline</label>
          <input formControlName="headline" placeholder="e.g. Senior Software Engineer at Google">
        </div>
        <div class="form-group mb-0">
          <label>Bio</label>
          <textarea formControlName="bio" placeholder="Tell us about yourself..."></textarea>
        </div>
      </div>

      <!-- Professional Info -->
      <div class="card section-card">
        <h3>Professional Background</h3>
        <div class="form-row">
          <div class="form-group half">
            <label>Current Company</label>
            <input formControlName="currentCompany" placeholder="Company Name">
          </div>
          <div class="form-group half">
            <label>Current Role</label>
            <input formControlName="currentRole" placeholder="Job Title">
          </div>
        </div>
        <div class="form-row mb-0">
          <div class="form-group half">
            <label>Location</label>
            <input formControlName="location" placeholder="City, Country">
          </div>
          <div class="form-group half">
            <label>Years of Experience</label>
            <input type="number" formControlName="experience" min="0">
          </div>
        </div>
      </div>

      <!-- Skills & Domains -->
      <div class="card section-card">
        <h3>Skills & Domains</h3>
        
        <div class="form-group">
          <label>Skills</label>
          <div class="tags-container">
            <div class="tag" *ngFor="let skill of skills">
              {{ skill }}
              <button type="button" (click)="removeSkill(skill)"><lucide-icon name="x" size="14"></lucide-icon></button>
            </div>
            <input 
              type="text" 
              class="tag-input" 
              placeholder="Type a skill and press Enter" 
              [(ngModel)]="newSkill" 
              [ngModelOptions]="{standalone: true}"
              (keydown.enter)="addSkill($event)"
            >
          </div>
        </div>

        <div class="form-group mb-0">
          <label>Domains of Interest</label>
          <div class="tags-container">
            <div class="tag" *ngFor="let domain of domains">
              {{ domain }}
              <button type="button" (click)="removeDomain(domain)"><lucide-icon name="x" size="14"></lucide-icon></button>
            </div>
            <input 
              type="text" 
              class="tag-input" 
              placeholder="Type a domain and press Enter" 
              [(ngModel)]="newDomain" 
              [ngModelOptions]="{standalone: true}"
              (keydown.enter)="addDomain($event)"
            >
          </div>
        </div>
      </div>

      <!-- Links & Privacy -->
      <div class="card section-card">
        <h3>Links & Privacy</h3>
        
        <div class="form-group">
          <label>LinkedIn URL</label>
          <input formControlName="linkedinUrl" placeholder="https://linkedin.com/in/username">
        </div>
        
        <div class="form-group">
          <label>GitHub URL</label>
          <input formControlName="githubUrl" placeholder="https://github.com/username">
        </div>

        <div class="form-group">
          <label>Profile Visibility</label>
          <select formControlName="profileVisibility">
            <option value="public">Public (Everyone)</option>
            <option value="students-only">Students Only</option>
            <option value="private">Private</option>
          </select>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary" [disabled]="profileForm.invalid || isSaving">
          <span *ngIf="!isSaving">Save Profile</span>
          <div *ngIf="isSaving" class="spinner spinner-sm"></div>
        </button>
      </div>
    </form>
  </div>
</div>
